<title>Doujar Privacy Policy</title>
<style>
:root{color-scheme:light}

html{background:#fff;color:#202020}
body{margin:0;font:17px/1.85 Georgia,"Times New Roman","Songti SC","Noto Serif CJK SC",SimSun,serif;-webkit-text-size-adjust:100%}
main{max-width:850px;margin:64px auto;padding:0 40px}

footer{border-top:1px solid #aaa;margin-top:44px;padding-top:20px;color:#555;font:13px/1.8 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}

.policy-links{list-style:none;padding:0;margin:24px 0}
.policy-links li{padding:0;margin:18px 0}

@media(max-width:600px){body{font-size:16px}main{margin:32px auto;padding:0 22px}h1{font-size:27px}h2{font-size:19px}header{padding-bottom:20px;margin-bottom:26px}}
